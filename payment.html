<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YorumAI Pro — Kart Bilgileri</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf9f7; margin: 0; padding: 24px; color: #1f1b16; }
  .card { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #e7e3de; border-radius: 12px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #6b6459; font-size: 13px; margin: 0 0 20px; }
  #error { color: #d1362f; font-size: 13px; text-align: center; }
  #loading { color: #6b6459; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Kart Bilgileriniz</h1>
    <p class="sub">Bilgileriniz doğrudan iyzico'nun güvenli altyapısına gönderilir.</p>
    <p id="loading">Yükleniyor...</p>
    <p id="error"></p>
    <div id="iyzipay-checkout-form" class="responsive"></div>
  </div>

  <script>
    // NOT: Bu, senin Supabase projenin herkese açık (publishable) anahtarıdır,
    // gizli değildir — extension'ın diğer dosyalarında da aynı şekilde kullanılıyor.
    const SUPABASE_FUNCTIONS_URL = "https://vfjsazbfwezzpktqxnmo.supabase.co/functions/v1";
    const ANON_KEY = "sb_publishable_80agFjI2JZ9QW4adDO3elA_CmzNzuyn";

    function injectScriptContent(container, htmlWithScript) {
      container.innerHTML = htmlWithScript;
      container.querySelectorAll("script").forEach((oldScript) => {
        const newScript = document.createElement("script");
        if (oldScript.src) newScript.src = oldScript.src;
        else newScript.textContent = oldScript.textContent;
        oldScript.replaceWith(newScript);
      });
    }

    async function loadPaymentForm() {
      const params = new URLSearchParams(window.location.search);
      const conversationId = params.get("order");
      const loadingEl = document.getElementById("loading");
      const errorEl = document.getElementById("error");

      if (!conversationId) {
        loadingEl.style.display = "none";
        errorEl.textContent = "Geçersiz bağlantı — sipariş bilgisi eksik.";
        return;
      }

      // 2026-09-03: Gerçek bir testte, sayfa açılır açılmaz atılan bu istek
      // bazen "Failed to fetch" (net::ERR_BLOCKED_BY_CLIENT) ile başarısız
      // oluyordu — ama aynı istek bir kaç saniye sonra elle tekrar
      // denendiğinde hep başarılı oluyordu (muhtemelen bir tarayıcı
      // koruması "sayfa yüklenir yüklenmez atılan üçüncü taraf istekleri"
      // şüpheli buluyor). Kalıcı bir engel değil, geçici — bu yüzden kesin
      // sebebi çözmek yerine basitçe birkaç kez, kısa bir bekleyişle
      // tekrar deniyoruz; kullanıcı "Failed to fetch" gibi teknik bir
      // hatayı görmeden önce.
      const MAX_ATTEMPTS = 3;
      let lastError = null;
      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        try {
          const res = await fetch(SUPABASE_FUNCTIONS_URL + "/get-checkout-content", {
            method: "POST",
            headers: { "Content-Type": "application/json", apikey: ANON_KEY },
            body: JSON.stringify({ conversationId }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Ödeme formu yüklenemedi.");
          }
          loadingEl.style.display = "none";
          const container = document.getElementById("iyzipay-checkout-form");
          injectScriptContent(container, data.checkoutFormContent);
          return; // başarılı, döngüden çık
        } catch (err) {
          lastError = err;
          if (attempt < MAX_ATTEMPTS) {
            await new Promise((resolve) => setTimeout(resolve, 1200));
          }
        }
      }
      loadingEl.style.display = "none";
      errorEl.textContent = (lastError && lastError.message) || "Bir hata oluştu.";
    }

    loadPaymentForm();
  </script>
</body>
</html>
